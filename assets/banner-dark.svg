<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Sasank Reddy, full-stack engineer and applied AI, Vijayawada India, B.Tech CSE VIT-AP 2026">
<title>Sasank Reddy &#8212; full-stack engineer &#183; applied AI</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#11171F"/>
    <stop offset="1" stop-color="#0D1117"/>
  </linearGradient>

  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.6" cy="1.6" r="1.6" fill="#242B35"/>
  </pattern>

  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#4493F8" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#4493F8" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="sweepgrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#4493F8" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4493F8" stop-opacity="0.13"/>
    <stop offset="1"   stop-color="#4493F8" stop-opacity="0"/>
  </linearGradient>

  <clipPath id="card">
    <rect x="0.5" y="0.5" width="1199" height="299" rx="14"/>
  </clipPath>
</defs>

<style>
  /* Nodes breathe out of step with each other so the graph never looks like
     it is ticking to a metronome. */
  .n  { animation: pulse 3.6s ease-in-out infinite; }
  .d1 { animation-delay: -0.2s } .d2 { animation-delay: -0.9s }
  .d3 { animation-delay: -1.5s } .d4 { animation-delay: -2.1s }
  .d5 { animation-delay: -2.8s } .d6 { animation-delay: -3.3s }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }

  /* A short dash travelling each edge — reads as traffic moving through a
     system rather than as decoration. */
  .flow { stroke-dasharray: 7 200; animation: flow 4.6s linear infinite; }
  .f2 { animation-delay: -1.1s } .f3 { animation-delay: -2.2s }
  .f4 { animation-delay: -0.6s } .f5 { animation-delay: -3.1s }
  .f6 { animation-delay: -1.8s } .f7 { animation-delay: -2.6s }
  @keyframes flow { to { stroke-dashoffset: -207 } }

  .breathe { transform-box: fill-box; transform-origin: center;
             animation: breathe 7.5s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .8; transform: scale(1) }
                       50%      { opacity: 1;  transform: scale(1.07) } }

  .sweep { animation: sweep 11s ease-in-out infinite; }
  @keyframes sweep { 0%   { transform: translateX(-320px) }
                     100% { transform: translateX(1420px) } }

  @media (prefers-reduced-motion: reduce) {
    .n, .flow, .breathe, .sweep { animation: none }
    .flow { stroke-dasharray: none; opacity: 0 }
  }
</style>

<g clip-path="url(#card)">
  <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#dots)"/>
  <circle class="breathe" cx="1010" cy="140" r="150" fill="url(#glow)"/>
  <rect class="sweep" x="-160" y="-40" width="220" height="380" fill="url(#sweepgrad)" transform-origin="0 0"/>
</g>

<!-- registration marks -->
<g fill="none" stroke="#4493F8" stroke-width="1.5" stroke-opacity="0.5">
  <path d="M26 44 V26 H44"/>
  <path d="M1174 44 V26 H1156"/>
  <path d="M26 256 V274 H44"/>
  <path d="M1174 256 V274 H1156"/>
</g>

<!-- systems graph: static edges, then the travelling dashes over them -->
<g stroke="#4493F8" stroke-opacity="0.30" stroke-width="1.4" fill="none">
  <path d="M905 108 L1000 78"/>
  <path d="M1000 78 L1088 118"/>
  <path d="M905 108 L952 168"/>
  <path d="M952 168 L1046 196"/>
  <path d="M1046 196 L1116 176"/>
  <path d="M1088 118 L1116 176"/>
  <path d="M1088 118 L1046 196"/>
</g>
<g stroke="#7FB8FF" stroke-opacity="0.95" stroke-width="2.4" fill="none" stroke-linecap="round">
  <path class="flow"    d="M905 108 L1000 78"/>
  <path class="flow f2" d="M1000 78 L1088 118"/>
  <path class="flow f3" d="M905 108 L952 168"/>
  <path class="flow f4" d="M952 168 L1046 196"/>
  <path class="flow f5" d="M1046 196 L1116 176"/>
  <path class="flow f6" d="M1088 118 L1116 176"/>
  <path class="flow f7" d="M1088 118 L1046 196"/>
</g>
<g fill="#4493F8">
  <circle class="n d1" cx="905"  cy="108" r="5"/>
  <circle class="n d2" cx="1088" cy="118" r="6"/>
  <circle class="n d3" cx="1046" cy="196" r="5.5"/>
</g>
<g fill="#0D1117" stroke="#4493F8" stroke-width="1.7">
  <circle class="n d4" cx="1000" cy="78"  r="5"/>
  <circle class="n d5" cx="952"  cy="168" r="4.5"/>
  <circle class="n d6" cx="1116" cy="176" r="4.5"/>
</g>

<!-- type -->
<text x="72" y="134"
      font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="60" font-weight="700" letter-spacing="1.5" fill="#E6EDF3">SASANK REDDY</text>

<rect x="72" y="158" width="88" height="5" rx="2.5" fill="#4493F8"/>

<text x="72" y="205"
      font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="24" font-weight="400" fill="#9198A1">Full-stack engineer &#183; applied AI</text>

<text x="72" y="251"
      font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
      font-size="13.5" letter-spacing="2" fill="#9198A1">VIJAYAWADA, INDIA&#160;&#160;&#183;&#160;&#160;B.TECH CSE, VIT-AP 2026</text>

<rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#30363D" stroke-width="1"/>
</svg>
